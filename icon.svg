<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="4" />

  <!-- Subtle 4x4 Grid -->
  <g stroke="rgba(148,163,184,0.16)" stroke-width="3">
    <line x1="144" y1="56" x2="144" y2="456" />
    <line x1="256" y1="56" x2="256" y2="456" />
    <line x1="368" y1="56" x2="368" y2="456" />
    <line x1="56" y1="144" x2="456" y2="144" />
    <line x1="56" y1="256" x2="456" y2="256" />
    <line x1="56" y1="368" x2="456" y2="368" />
  </g>

  <!-- Pipes -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Red Pipe -->
    <path d="M 100 100 L 100 200 L 200 200 L 200 312" stroke="#f43f5e" stroke-width="32" />
    <path d="M 100 100 L 100 200 L 200 200 L 200 312" stroke="#fda4af" stroke-width="10" opacity="0.65" />

    <!-- Cyan Pipe -->
    <path d="M 200 100 L 412 100 L 412 312 L 312 312" stroke="#38bdf8" stroke-width="32" />
    <path d="M 200 100 L 412 100 L 412 312 L 312 312" stroke="#bae6fd" stroke-width="10" opacity="0.65" />

    <!-- Amber Pipe -->
    <path d="M 100 312 L 100 412 L 412 412" stroke="#f59e0b" stroke-width="32" />
    <path d="M 100 312 L 100 412 L 412 412" stroke="#fde68a" stroke-width="10" opacity="0.65" />
  </g>

  <!-- Dots -->
  <g filter="url(#glow)">
    <circle cx="100" cy="100" r="34" fill="#f43f5e" />
    <circle cx="200" cy="312" r="34" fill="#f43f5e" />

    <circle cx="200" cy="100" r="34" fill="#38bdf8" />
    <circle cx="312" cy="312" r="34" fill="#38bdf8" />

    <circle cx="100" cy="312" r="34" fill="#f59e0b" />
    <circle cx="412" cy="412" r="34" fill="#f59e0b" />
  </g>

  <!-- Gloss Highlights -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="89" cy="89" r="9" />
    <circle cx="189" cy="301" r="9" />
    <circle cx="189" cy="89" r="9" />
    <circle cx="301" cy="301" r="9" />
    <circle cx="89" cy="301" r="9" />
    <circle cx="401" cy="401" r="9" />
  </g>
</svg>
